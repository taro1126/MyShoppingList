
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>お買い物リスト</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">

  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>

<body>
  <div class="container">
    <header class="page-header">
      <h1>お買い物リスト</h1>
      <p class="page-subtitle">必要なものを、さっと追加。</p>
    </header>

    <form id="itemForm" class="input-area">
      <textarea
        id="itemInput"
        rows="1"
        placeholder="買うものを入力"
        ></textarea>
      
      <select id="categoryInput" aria-label="カテゴリ">
      </select>

      <button type="submit">追加</button>
    </form>

    <div class="category-management">
      <button id="addCategoryButton" type="button">
        ＋ カテゴリ追加
      </button>
      <button id="completedToggle" type="button" aria-expanded="false"></button>
    </div>

    <div id="itemList"></div>
  </div>

  <div id="undoNotice" class="undo-notice" role="status" aria-live="polite" hidden>
    <span id="undoMessage"></span>
    <button id="undoButton" type="button">元に戻す</button>
  </div>

  <script src="./script.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js");
      });
    }
  </script>
</body>
</html>
